<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apothena Education Path Planner (Open)</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a5f;--gold:#c9a84c;--gold-light:#f5e9cc;--gold-muted:#e8d5a3;
  --ink:#1a1a2e;--muted:#5a6070;--soft:#9aa0ad;
  --cream:#faf8f4;--white:#ffffff;--border:#e4dfd6;--border2:#d0c9be;
  --teal:#0f6e56;--teal-bg:#e1f5ee;
  --blue:#1c4e80;--blue-bg:#eef4fb;
  --amber:#7a4800;--amber-bg:#faeeda;
  --purple:#3c3489;--purple-bg:#ede9f7;
  --green:#3b6d11;--green-bg:#eaf3de;
  --coral:#8b2500;--coral-bg:#faece7;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
#topbar{background:var(--navy);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;height:60px}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-divider{width:1px;height:28px;background:rgba(255,255,255,.2)}
.topbar-title{font-size:.95rem;font-weight:600;color:var(--gold);letter-spacing:.01em}
#top-label{font-size:12px;color:rgba(255,255,255,.45)}
#shell{display:flex;min-height:calc(100vh - 60px)}
#sidebar{width:248px;background:var(--white);border-right:1px solid var(--border);flex-shrink:0;padding:22px 0;overflow-y:auto;display:flex;flex-direction:column}
.sb-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:0 20px 10px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;font-size:13px;color:var(--muted);transition:all .15s;user-select:none}
.nav-item:hover{background:var(--cream);color:var(--ink)}
.nav-item.active{border-left-color:var(--gold);background:var(--gold-light);color:var(--navy);font-weight:600}
.nav-item.visited{color:var(--teal);cursor:pointer}
.nav-item.skipped{color:var(--soft);font-style:italic}
.nav-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;transition:all .15s}
.nav-item.active .nav-dot{background:var(--gold);border-color:var(--gold)}
.nav-item.visited .nav-dot{background:var(--teal);border-color:var(--teal)}
.nav-item.skipped .nav-dot{background:var(--soft);border-color:var(--soft)}
#sidebar-footer{margin-top:auto;padding:16px 16px 8px;border-top:1px solid var(--border)}
#client-chip{font-size:12px;color:var(--muted);padding:9px 11px;background:var(--cream);border-radius:8px;border:1px solid var(--border);display:none;margin-bottom:10px}
#client-chip strong{display:block;color:var(--ink);font-size:13px;margin-bottom:1px}
.save-btn{width:100%;padding:8px 0;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--white);color:var(--muted);transition:all .15s;text-align:center;margin-bottom:6px}
.save-btn:hover{border-color:var(--navy);color:var(--navy)}
.save-btn.resume{background:var(--gold-light);border-color:var(--gold);color:var(--amber)}
.brand-link{display:block;text-align:center;font-size:11px;color:var(--soft);margin-top:8px;text-decoration:none}
.brand-link:hover{color:var(--gold)}
#content{flex:1;padding:34px 42px;max-width:820px}
#progress-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:34px;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:2px;transition:width .35s ease;width:11%}
#section-wrap{min-height:200px}
.sec-head{margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.fw-tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 11px;border-radius:20px;margin-bottom:10px}
.sec-head h2{font-size:1.7rem;font-weight:700;margin-bottom:5px;letter-spacing:-.02em}
.sec-head p{font-size:13px;color:var(--muted);max-width:480px;line-height:1.6}
.coach-box{background:var(--blue-bg);border:1px solid #b5d4f4;border-radius:8px;padding:11px 14px;font-size:12px;color:var(--blue);margin-top:12px;line-height:1.6}
.coach-box b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.ref-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;margin-top:12px;padding:6px 12px;border:1px solid var(--gold-muted);border-radius:20px;background:var(--gold-light);user-select:none;transition:all .15s}
.ref-toggle:hover{background:var(--gold-muted)}
.ref-panel{display:none;margin-top:12px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.ref-panel.open{display:block}
.ref-panel h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.ref-list{display:flex;flex-direction:column;gap:7px}
.ref-list-item{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:var(--cream);border:1px solid var(--border)}
.ref-list-item .rl-code{font-size:12px;font-weight:700;color:var(--navy);min-width:32px;flex-shrink:0}
.ref-list-item .rl-body{font-size:12px;color:var(--muted);line-height:1.45}
.ref-list-item .rl-body b{color:var(--ink)}
.intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{border:1px solid var(--border2);border-radius:8px;padding:9px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:border .15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.fg textarea{resize:vertical;min-height:74px}
.q-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:12px}
.q-num{font-size:11px;color:var(--soft);margin-bottom:5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.q-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:14px;color:var(--ink)}
.scale-wrap{display:flex;flex-direction:column;gap:6px}
.scale-btns{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sc-btn{flex:1;padding:9px 0;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);border:none;border-right:1px solid var(--border);font-family:inherit;transition:all .12s}
.sc-btn:last-child{border-right:none}
.sc-btn:hover{background:var(--gold-light);color:var(--amber)}
.sc-btn.picked{background:var(--navy);color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);padding:0 2px}
.text-ans{width:100%;border:1px solid var(--border2);border-radius:8px;padding:9px 13px;font-size:14px;font-family:inherit;color:var(--ink);resize:vertical;min-height:60px;outline:none;transition:border .15s;margin-top:8px}
.text-ans:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.text-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:10px}
#btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:20px;border-top:1px solid var(--border);gap:10px;flex-wrap:wrap}
.btn{padding:10px 24px;border-radius:8px;font-size:14px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--border2);background:#fff;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:#152d4a}
.btn-skip{background:#fff;color:var(--soft);border:1px dashed var(--border2);font-size:13px;padding:10px 18px}
.btn-skip:hover{color:var(--muted);border-color:var(--muted)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:14px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:1.2rem;font-weight:700;margin-bottom:6px;color:var(--navy)}
.modal p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.modal-row{display:flex;gap:10px;flex-wrap:wrap}
.modal-row .btn{flex:1}
.modal-input{width:100%;border:1px solid var(--border2);border-radius:8px;padding:10px 13px;font-size:1rem;font-family:inherit;outline:none;margin-bottom:12px}
.modal-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.modal-error{font-size:12px;color:#c0392b;margin-bottom:10px;text-align:center}
.results-hero{background:var(--navy);color:#fff;border-radius:12px;padding:26px 30px;margin-bottom:22px;position:relative;overflow:hidden}
.results-hero::after{content:'';position:absolute;right:-20px;top:-20px;width:140px;height:140px;border-radius:50%;background:rgba(201,168,76,.08);pointer-events:none}
.results-hero h2{font-size:1.75rem;font-weight:700;margin-bottom:3px;letter-spacing:-.02em}
.results-hero .sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:18px}
.type-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-chip{border-radius:8px;padding:12px 14px;text-align:center;background:rgba(201,168,76,.15)}
.type-chip .tv{font-size:1.3rem;font-weight:700;line-height:1.1;color:var(--gold)}
.type-chip .tl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
.rs{margin-bottom:20px}
.rs-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.fw-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:9px}
.fw-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.fw-card-title{font-size:14px;font-weight:700}
.fw-card-sub{font-size:12px;color:var(--muted);margin-top:1px}
.fw-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.fw-body{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.coaching-prompt{background:var(--gold-light);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:9px 12px;font-size:12px;color:var(--amber);line-height:1.6}
.coaching-prompt b{color:var(--navy);font-size:10px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.skipped-note{font-size:12px;color:var(--soft);font-style:italic}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{font-size:12px;min-width:200px;color:var(--muted)}
.bar-track{flex:1;height:5px;background:var(--cream);border-radius:3px;border:1px solid var(--border);overflow:hidden}
.bar-fill{height:100%;background:var(--navy);border-radius:3px}
.bar-val{font-size:11px;color:var(--soft);min-width:34px;text-align:right}
.steps-list{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.step-row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:13px;color:var(--muted);line-height:1.55}
.step-text strong{color:var(--ink);display:block;margin-bottom:1px}
.print-btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.results-footer{text-align:center;margin-top:28px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--soft);line-height:1.7}
.results-footer a{color:var(--gold);text-decoration:none;font-weight:600}
.tag-ip{background:var(--teal-bg);color:var(--teal)}
.tag-pfp{background:var(--purple-bg);color:var(--purple)}
.tag-ase{background:var(--green-bg);color:var(--green)}
.tag-ai{background:var(--amber-bg);color:var(--amber)}
.tag-pp{background:var(--coral-bg);color:var(--coral)}
.tag-int{background:var(--gold-light);color:var(--amber)}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-name{font-size:13px;font-weight:600;color:var(--ink)}
.hist-date{font-size:11px;color:var(--soft);margin-top:2px}
.hist-actions{display:flex;gap:6px;flex-shrink:0}
.hist-load-btn{padding:6px 14px;font-size:12px;background:var(--navy);color:#fff;border-color:var(--navy)}
.hist-load-btn:hover{background:#152d4a}
.hist-del-btn{padding:6px 10px;font-size:12px;color:var(--soft);border-color:var(--border)}
.hist-del-btn:hover{color:#c0392b;border-color:#c0392b}
#confirm-banner{display:none;position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.2)}
@media print{
  #topbar,#sidebar,#btn-row,.print-btn-row,.ref-toggle,.modal-overlay,#confirm-banner{display:none!important}
  #shell{display:block}
  #content{padding:0;max-width:100%}
  body{font-size:12px}
  .results-hero{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .type-chip{background:rgba(201,168,76,.15)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fw-card,.steps-list,.ref-panel{break-inside:avoid}
  .ref-panel{display:block!important}
  @page{margin:1.8cm}
  .results-footer{display:block!important}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="topbar">
  <div class="topbar-left"><div class="topbar-title">Education Path Planner (Open)</div></div>
  <span id="top-label">Step 1</span>
</div>

<div id="shell">
  <div id="sidebar">
    <div class="sb-label">Assessment Sections</div>
    <div id="sidebar-nav"></div>
    <div id="sidebar-footer">
      <div id="client-chip"><strong id="chip-name"></strong><span id="chip-date"></span></div>
      <button class="save-btn" onclick="showSaveModal()">&#128190; Save &amp; Quit</button>
      <button class="save-btn resume" onclick="showHistoryModal()">&#128065; Previous Assessments</button>
      <a class="brand-link" href="https://apothena.com" target="_blank">apothena.com</a>
    </div>
  </div>
  <div id="content">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="section-wrap"></div>
    <div id="btn-row">
      <button class="btn" id="btn-back">&#8592; Back</button>
      <button class="btn btn-skip" id="btn-skip">Skip section</button>
      <button class="btn btn-primary" id="btn-next">Continue &#8594;</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="save-modal">
  <div class="modal">
    <h3>Save Session</h3>
    <p>Confirm the client name to save this session. You can resume it later from <strong>Previous Assessments</strong>.</p>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin-bottom:5px;font-weight:600">Client Name</div>
    <input class="modal-input" id="save-name-input" placeholder="Client full name">
    <div class="modal-error" id="save-error"></div>
    <div class="modal-row">
      <button class="btn" onclick="closeSaveModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doSave()">Save &amp; Quit &#8594;</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="history-modal">
  <div class="modal" style="max-width:500px">
    <h3>Previous Assessments</h3>
    <p>Select a saved session to resume, or delete sessions you no longer need.</p>
    <div id="history-list" style="max-height:320px;overflow-y:auto;margin-bottom:16px;border:1px solid var(--border);border-radius:8px"></div>
    <div class="modal-row"><button class="btn btn-primary" onclick="closeHistoryModal()">Close</button></div>
  </div>
</div>

<div id="confirm-banner"></div>

<script>
var TOOL_ID = "education-open";

var _db = null;
var _fbReady = false;
function initFirebase(){
  try{
    var cfg = {
      apiKey: "AIzaSyCqx2vzzpJCTkUiymDbhjtsi6NpF5pgi6U",
      authDomain: "apothena-assessments.firebaseapp.com",
      projectId: "apothena-assessments",
      storageBucket: "apothena-assessments.firebasestorage.app",
      messagingSenderId: "161975263646",
      appId: "1:161975263646:web:dd30980809e3593601b68f"
    };
    firebase.initializeApp(cfg);
    _db = firebase.firestore();
    _fbReady = true;
  }catch(e){ console.warn('Firebase init failed, falling back to localStorage', e); _fbReady = false; }
}

var SECTIONS = [
  { id: 'intake',  label: 'Client Intake',         noSkip: true, session: 0 },
  { id: 'ip_mini', label: 'Interests',             tag: 'tag-ip',  tagLabel: 'O*NET Interests',                  session: 1 },
  { id: 'pfp',     label: 'Program Preferences',   tag: 'tag-pfp', tagLabel: 'Program-Format Preferences',       session: 2 },
  { id: 'ase',     label: 'Academic Confidence',   tag: 'tag-ase', tagLabel: 'Academic Self-Efficacy',           session: 2 },
  { id: 'ai',      label: 'Academic Interests',    tag: 'tag-ai',  tagLabel: 'Academic Interests (CIP-mapped)',  session: 3 },
  { id: 'pp',      label: 'Practical Priorities',  tag: 'tag-pp',  tagLabel: 'Practical Priorities',             session: 3 },
  { id: 'results', label: 'Education Profile',     noSkip: true, session: 0 }
];

var REFERENCES = {
  ip_mini: {
    title: 'Holland RIASEC Interests (O*NET Interest Profiler Mini)',
    intro: 'Six interest types developed by John Holland and operationalized by the U.S. Department of Labor in O*NET. Items are public domain. The top three letters form a Holland code that signals career environments most likely to fit.',
    listLabel: 'The Six RIASEC Types',
    types: [
      { code:'R', name:'Realistic',     desc:'Hands-on, mechanical, physical work.' },
      { code:'I', name:'Investigative', desc:'Research, analysis, intellectual inquiry.' },
      { code:'A', name:'Artistic',      desc:'Creative, expressive, unstructured work.' },
      { code:'S', name:'Social',        desc:'Working with and helping people.' },
      { code:'E', name:'Enterprising',  desc:'Leading, persuading, influencing.' },
      { code:'C', name:'Conventional',  desc:'Organized, structured, detail work.' }
    ]
  },
  pfp: {
    title: 'Program-Format Preferences (Apothena, bespoke)',
    intro: 'Direct preference measurement, not a learning-style typology. Items capture the program characteristics that matter to fit and persistence. There is no aggregate score; each rating is reported individually.',
    listLabel: 'Why Direct Preferences (not VARK)',
    types: [
      { code:'Why', name:'Evidence basis', desc:'The learning-styles matching hypothesis is not supported (Pashler 2008, Riener and Willingham 2010, Kirschner 2017). Direct preferences are.' },
      { code:'How', name:'How to use',     desc:'Group answers around modality, pace, schedule, structure, and program type when debriefing.' }
    ]
  },
  ase: {
    title: 'Academic Self-Efficacy (Apothena, bespoke)',
    intro: 'Eight items grounded in Bandura (1977, 1997) and Pajares on academic self-efficacy. Domain-specific (school or training) rather than general life. Mean score range 1.0 to 5.0.',
    listLabel: 'How to Read the Mean',
    types: [
      { code:'1.0-2.4', name:'Lower',    desc:'Plan a small, real mastery experience this week. Avoid abstract pep talk.' },
      { code:'2.5-3.4', name:'Moderate', desc:'Common range. Pick one academic behavior to strengthen this term.' },
      { code:'3.5-5.0', name:'Higher',   desc:'High academic confidence. Channel into a focused commitment with a deadline.' }
    ]
  },
  ai: {
    title: 'Academic Interests (CIP two-digit, bespoke)',
    intro: 'Eighteen academic domains drawn from the U.S. Department of Education Classification of Instructional Programs (CIP). Each carries the CIP two-digit code so the top picks can be linked to program search later.',
    listLabel: 'How to Use the Top 5',
    types: [
      { code:'Top 5',   name:'Lead with these', desc:'Search programs in these CIP categories. Draft three concrete program names per top category.' },
      { code:'Bottom',  name:'Worth checking',  desc:'A very low rating combined with a constraint (cost, time, location) is a useful "no, not this" signal.' }
    ]
  },
  pp: {
    title: 'Practical Priorities (Apothena, bespoke)',
    intro: 'Five practical constraints commonly surfaced in VR-funded program selection. Importance rating plus optional open text for the coaching conversation.',
    listLabel: 'The Five Priorities',
    types: [
      { code:'Time',     name:'Time-to-credential',                desc:'How fast can the credential land?' },
      { code:'Cost',     name:'Cost tolerance',                    desc:'What is the strict budget?' },

var cur = 0, maxVisited = 0, skipped = {}, answers = {};
var scaleScores = {
  Realistic:0, Investigative:0, Artistic:0, Social:0, Enterprising:0, Conventional:0,
  ASE:0
};
var intake = { name:'', age:'', date:'', coach:'', goal:'', current:'', constraints:'', concerns:'' };

// ── SAVE / RESUME ─────────────────────────────────────────────────────────────
function getSavePayload(){
  return { cur:cur, maxVisited:maxVisited, skipped:skipped, answers:answers, scaleScores:scaleScores, intake:intake, savedAt:new Date().toISOString() };
}
function applySavePayload(d){
  try{
    if(typeof d === 'string') d = JSON.parse(d);
    if(d.payload && typeof d.payload === 'string'){ try{ d = JSON.parse(d.payload); }catch(e){} }
    cur = d.cur||0; maxVisited = d.maxVisited||0; skipped = d.skipped||{}; answers = d.answers||{};
    if(d.scaleScores) Object.keys(d.scaleScores).forEach(function(k){ if(scaleScores.hasOwnProperty(k)) scaleScores[k] = d.scaleScores[k]; });
    if(d.intake) Object.keys(d.intake).forEach(function(k){ intake[k] = d.intake[k]||''; });
    return true;
  }catch(e){ return false; }
}
function getClientName(){ var el = document.getElementById('f-name'); var n = (el?el.value:'') || intake.name || ''; return n.trim(); }
function showSaveModal(){
  var n = getClientName();
  document.getElementById('save-name-input').value = n;
  document.getElementById('save-error').textContent = '';
  document.getElementById('save-modal').classList.remove('hidden');
}
function closeSaveModal(){ document.getElementById('save-modal').classList.add('hidden'); }
function doSave(){
  var name = document.getElementById('save-name-input').value.trim();
  if(!name){ document.getElementById('save-error').textContent = 'Please enter a client name to save.'; return; }
  if(SECTIONS[cur].id === 'intake') saveIntakeFields();
  intake.name = name;
  var payload = getSavePayload();
  var docId = name.toLowerCase().replace(/[^a-z0-9]+/g,'_') + '_' + TOOL_ID;
  if(_fbReady){
    _db.collection('assessments').doc(docId).set({
      clientName: name,
      tool: TOOL_ID,
      savedAt: payload.savedAt,
      cur: payload.cur,
      maxVisited: payload.maxVisited,
      intakeName: name,
      intakeDate: (payload.intake && payload.intake.date) || '',
      payload: JSON.stringify(payload)
    }).then(function(){ closeSaveModal(); showConfirmBanner('Saved to cloud: ' + name); })
      .catch(function(e){ console.error('Firebase save failed', e); document.getElementById('save-error').textContent = 'Cloud save failed. Check your connection.'; });
  } else {
    try{
      localStorage.setItem('apothena_' + TOOL_ID + '_' + docId, JSON.stringify(payload));
      closeSaveModal();
      showConfirmBanner('Saved locally: ' + name);
    }catch(e){ document.getElementById('save-error').textContent = 'Could not save session.'; }
  }
}
function showConfirmBanner(msg){ var b = document.getElementById('confirm-banner'); if(!b) return; b.textContent = msg; b.style.display = 'block'; setTimeout(function(){ b.style.display = 'none'; }, 3000); }
function showHistoryModal(){
  document.getElementById('history-list').innerHTML = '<div style="padding:20px;text-align:center;color:var(--soft);font-size:13px">Loading...</div>';
  document.getElementById('history-modal').classList.remove('hidden');
  loadHistoryList();
}
function closeHistoryModal(){ document.getElementById('history-modal').classList.add('hidden'); }
function loadHistoryList(){
  if(_fbReady){
    _db.collection('assessments').where('tool','==',TOOL_ID).get()
      .then(function(snap){
        var sessions = [];
        snap.forEach(function(doc){ sessions.push({ id:doc.id, data:doc.data() }); });
        sessions.sort(function(a,b){ return (b.data.savedAt||'').localeCompare(a.data.savedAt||''); });
        renderHistoryList(sessions);
      }).catch(function(e){ console.error('Firebase load failed:', e.code, e.message); renderHistoryList(getLocalSessions()); });
  } else { renderHistoryList(getLocalSessions()); }
}
function getLocalSessions(){
  var sessions = [];
  for(var i=0;i<localStorage.length;i++){
    var key = localStorage.key(i);
    if(key && key.indexOf('apothena_' + TOOL_ID + '_') === 0){
      try{ var d = JSON.parse(localStorage.getItem(key)); sessions.push({ id:key, data:Object.assign({}, d, { clientName: d.intake && d.intake.name || key }) }); }catch(e){}
    }
  }
  sessions.sort(function(a,b){ return (b.data.savedAt||'').localeCompare(a.data.savedAt||''); });
  return sessions;
}
function renderHistoryList(sessions){
  var list = document.getElementById('history-list');
  if(!sessions || !sessions.length){ list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--soft);font-size:13px">No saved assessments yet.</div>'; return; }
  list.innerHTML = '';
  sessions.forEach(function(s){
    var d = s.data;
    var name = d.clientName || (d.intake && d.intake.name) || 'Unknown';
    var dateStr = '';
    try{ dateStr = new Date(d.savedAt).toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){}
    var row = document.createElement('div'); row.className = 'hist-row';
    row.innerHTML = '<div class="hist-info"><div class="hist-name">' + esc(name) + '</div><div class="hist-date">' + dateStr + '</div></div>'
      + '<div class="hist-actions">'
      + '<button class="btn hist-load-btn" data-id="' + esc(s.id) + '">Resume</button>'
      + '<button class="btn hist-del-btn" data-id="' + esc(s.id) + '" data-name="' + esc(name) + '">&#10005;</button>'
      + '</div>';
    list.appendChild(row);
  });
  list.querySelectorAll('.hist-load-btn').forEach(function(btn){ btn.addEventListener('click', function(){ loadSession(this.getAttribute('data-id')); }); });
  list.querySelectorAll('.hist-del-btn').forEach(function(btn){ btn.addEventListener('click', function(){ deleteSession(this.getAttribute('data-id'), this.getAttribute('data-name')); }); });
}
function loadSession(id){
  if(_fbReady){
    _db.collection('assessments').doc(id).get()
      .then(function(doc){ if(doc.exists && applySavePayload(doc.data())){ closeHistoryModal(); render(); updateClientChip(); } })
      .catch(function(e){ console.error('Load failed', e); var local = localStorage.getItem(id); if(local && applySavePayload(local)){ closeHistoryModal(); render(); updateClientChip(); } });
  } else { var local = localStorage.getItem(id); if(local && applySavePayload(local)){ closeHistoryModal(); render(); updateClientChip(); } }

function deleteSession(id, name){
  if(!confirm('Delete saved assessment for ' + name + '?')) return;
  if(_fbReady){ _db.collection('assessments').doc(id).delete().then(function(){ loadHistoryList(); }).catch(function(e){ console.error('Delete failed', e); }); }

function getRiasec(){
  var dims = [
    { code:'R', label:'Realistic',     score:scaleScores.Realistic },
    { code:'I', label:'Investigative', score:scaleScores.Investigative },
    { code:'A', label:'Artistic',      score:scaleScores.Artistic },
    { code:'S', label:'Social',        score:scaleScores.Social },
    { code:'E', label:'Enterprising',  score:scaleScores.Enterprising },
    { code:'C', label:'Conventional',  score:scaleScores.Conventional }
  ];
  var sorted = dims.slice().sort(function(a,b){ return b.score - a.score; });
  var top3 = sorted.slice(0,3);
  var code = top3.map(function(x){ return x.code; }).join('');
  var bars = dims.map(function(d){ return { label:d.label, pct:Math.round((d.score/25)*100) }; });
  var flat = (top3[0].score - top3[2].score) <= 2;
  return { code:code, top:top3[0].label, bars:bars, flat:flat };
}

ngly disagree","hi":"Strongly agree"},{"id":"pfp_16","text":"I would prefer a hybrid program (some online, some in person) over either fully online or fully in person.","lo":"Strongly disagree","hi":"Strongly agree"}].map(function(it){

function getASE(){
  var total = scaleScores.ASE || 0;
  var mean = total / 8;
  var band;
  if(mean < 2.5) band = 'Lower';
  else if(mean < 3.5) band = 'Moderate';
  else band = 'Higher';
  return { total:total, mean:mean.toFixed(2), band:band };
}

    + '</div></div>';

  // About + attributions
  html += '<div class="fw-card" style="margin-top:16px;border-color:var(--gold-muted);background:var(--gold-light)">'
    + '<div class="fw-card-title" style="color:var(--navy);margin-bottom:8px">About This Assessment</div>'
    + '<div class="fw-body" style="font-size:12px;color:var(--amber);line-height:1.7">'
    + 'Education Path Planner (Open) is the license-free counterpart to Apothena\'s standard Education Path Planner. The Interests section uses public-domain O*NET items. The other four sections (Program-Format Preferences, Academic Self-Efficacy, Academic Interests, Practical Priorities) are written by Apothena. Use the results as a structured starting point for coaching, not as a clinical or selection assessment.'
    + '</div></div>';

  html += '<div class="print-btn-row"><button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button><button class="btn" onclick="doRestart()">New Assessment</button></div>';

  html += '<div class="results-footer">'
    + 'Powered by <a href="https://apothena.com" target="_blank">Apothena Career Services</a>.<br>'
    + 'Items in the Interests section are adapted from the O*NET Interest Profiler, developed by the U.S. Department of Labor, Employment and Training Administration. O*NET is a trademark of USDOL/ETA. '
    + 'All other items are written by Apothena Career Services for use in client coaching.'
    + '</div>';

  return html;
}

function render(){
  var s = SECTIONS[cur];
  saveTextAnswers();
  var wrap = document.getElementById('section-wrap');
  if(s.id === 'intake') wrap.innerHTML = renderIntake();
  else if(s.id === 'results') wrap.innerHTML = renderResults();
  else wrap.innerHTML = renderSection(s.id);
  if(s.id === 'intake'){
    var sv = function(id, v){ var el = document.getElementById(id); if(el) el.value = v || ''; };
    sv('f-name', intake.name); sv('f-age', intake.age); sv('f-date', intake.date); sv('f-coach', intake.coach);
    sv('f-goal', intake.goal); sv('f-current', intake.current || ''); sv('f-constraints', intake.constraints || ''); sv('f-concerns', intake.concerns);
  }
  var nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  var lastSession = -1;
  SECTIONS.forEach(function(sec, i){
    if(sec.session && sec.session !== lastSession){
      var div = document.createElement('div');
      div.style.cssText = 'font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:14px 20px 4px;border-top:' + (lastSession > 0 ? '1px solid var(--border)' : 'none');
      div.textContent = 'Session ' + sec.session;
      nav.appendChild(div);
      lastSession = sec.session;
    }
    var d = document.createElement('div');
    d.className = 'nav-item' + (i === cur ? ' active' : skipped[sec.id] ? ' skipped' : i <= maxVisited ? ' visited' : '');
    d.innerHTML = '<div class="nav-dot"></div><span>' + esc(sec.label) + '</span>';
    d.setAttribute('data-i', String(i));
    d.addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-i'));
      if(cur === 0) saveIntakeFields();
      saveTextAnswers();
      cur = idx;
      if(cur > maxVisited) maxVisited = cur;
      render();
    });
    nav.appendChild(d);
  });
  var pct = Math.round(((cur+1) / SECTIONS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('top-label').textContent = 'Step ' + (cur+1) + ' of ' + SECTIONS.length;
  document.getElementById('btn-back').disabled = (cur === 0);
  var nxt = document.getElementById('btn-next');
  nxt.style.display = (cur === SECTIONS.length-1) ? 'none' : '';
  nxt.textContent = (cur === SECTIONS.length-2) ? 'Generate Report \u2192' : 'Continue \u2192';
  document.getElementById('btn-skip').style.display = s.noSkip ? 'none' : '';
  window.scrollTo(0, 0);
}
function goNext(){ if(cur === 0) saveIntakeFields(); if(cur < SECTIONS.length-1){ cur++; if(cur > maxVisited) maxVisited = cur; render(); } }
function goBack(){ if(cur === 0) saveIntakeFields(); if(cur > 0){ cur--; render(); } }
function doSkip(){ skipped[SECTIONS[cur].id] = true; goNext(); }
function doRestart(){
  cur = 0; maxVisited = 0; skipped = {}; answers = {};
  intake = { name:'', age:'', date:'', coach:'', goal:'', current:'', constraints:'', concerns:'' };
  Object.keys(scaleScores).forEach(function(k){ scaleScores[k] = 0; });
  var chip = document.getElementById('client-chip'); if(chip) chip.style.display = 'none';
  render();
}

initFirebase();
document.getElementById('btn-next').addEventListener('click', goNext);
document.getElementById('btn-back').addEventListener('click', goBack);
document.getElementById('btn-skip').addEventListener('click', doSkip);
render();
</script>

</body>
</html>
